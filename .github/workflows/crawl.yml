name: Run Crawler

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'The site URL to crawl'
        required: true
        default: 'https://example.com'

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run crawler
        run: node crawl.js "${{ github.event.inputs.target_url }}"

      - name: Print report in the log
        run: cat report.json

      - name: Upload report as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawl-report
          path: report.json
