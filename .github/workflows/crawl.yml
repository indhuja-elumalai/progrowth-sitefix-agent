name: Run Crawler

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "The site URL to crawl"
        required: true
        default: "https://example.com"
      max_pages:
        description: "Maximum pages to crawl (0 = no cap, crawl the whole site)"
        required: true
        default: "0"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run crawler
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
        run: node crawl.js "$TARGET_URL" --max-pages "$MAX_PAGES"

      - name: Build the explained report and PDF
        # Uses AI when the repository has an OPENAI_API_KEY secret; standard guidance otherwise.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node report.js

      - name: Upload reports as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawl-reports
          path: |
            report.json
            links.json
            metadata.json
            soft404.json
            images.json
            content.json
            audit-report/
            issues.json