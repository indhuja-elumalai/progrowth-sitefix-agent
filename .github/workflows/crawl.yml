name: Run Crawler

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "The site URL to crawl"
        required: true
        default: "https://example.com"
      max_pages:
        description: "Maximum pages to crawl (raise for large sites)"
        required: true
        default: "100"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run crawler
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
        run: node crawl.js "$TARGET_URL" --max-pages "$MAX_PAGES"

      - name: Upload reports as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: crawl-reports
          path: |
            report.json
            links.json