name: Fixture self-check

on:
  push:
    paths:
      - "fixture/**"
      - "lib/**"
      - "test/**"
      - "crawl.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fixture-selfcheck.yml"
  workflow_dispatch:

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Generate fixture pages
        run: node fixture/generate-site.js

      - name: Start fixture server
        run: |
          node fixture/server.js &
          sleep 2

      - name: Run fixture self-check
        run: node fixture/selfcheck.js

      - name: Crawl the fixture
        run: node crawl.js http://localhost:4000

      - name: Score the crawl against the planted issues
        run: node fixture/score.js --require 24